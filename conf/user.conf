# Aether Tunnel Configuration
# ============================
# Uncomment and modify values as needed.
# Changes require restart to take effect.

# Protocol: gool | masque | wireguard
# Default: gool (nested WireGuard - best for censorship bypass)
# AETHER_PROTOCOL=gool

# Scan mode: quick | balanced | turbo
# Default: balanced
# - quick:    Fast scan, may miss some endpoints
# - balanced: Good balance between speed and reliability
# - turbo:    Thorough scan, slower but more reliable
# AETHER_SCAN=balanced

# SOCKS5 proxy port
# Default: 1819
# AETHER_PORT=1819

# TUN device name
# Default: tun0
# AETHER_TUN=tun0

# TUN IPv4 address
# Default: 198.18.0.1
# AETHER_TUN_IP=198.18.0.1

# TUN IPv6 address
# Default: fc00::1
# AETHER_TUN_IPV6=fc00::1

# SOCKS mark for routing bypass (decimal or hex)
# Default: 438
# AETHER_MARK=438

# Auto-reconnect on failure
# Default: true
# When enabled, automatically reconnects if connection drops
# AETHER_AUTO_RECONNECT=true

# Log level: debug | info | warn | error
# Default: info
# AETHER_LOG_LEVEL=info

# Extra Aether arguments
# Add any additional Aether flags here
# Example: AETHER_EXTRA_ARGS="--noize firewall --wiw-peers 162.159.192.1:2408,188.114.96.1:2408"
# AETHER_EXTRA_ARGS=""
