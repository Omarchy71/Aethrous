# Aether Configuration
# This file is for documentation purposes - Aether uses command line flags
# and environment variables. See Aether documentation for full options.

# Protocol: masque | wireguard | gool
# Set via AETHER_PROTOCOL env var or --masque/--wireguard/--gool flags
AETHER_PROTOCOL=masque

# Scan mode: quick | balanced | turbo
# Set via AETHER_SCAN env var or --scan flag
AETHER_SCAN=balanced

# Additional Aether arguments
# AETHER_EXTRA_ARGS=""

# Upstream proxy (if Aether needs to connect through another proxy)
# AETHER_UPSTREAM_PROXY="socks5://127.0.0.1:1080"

# Routing by domain/address/port
# AETHER_ROUTING_RULES=""
